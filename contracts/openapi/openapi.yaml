openapi: 3.1.0
info:
  title: Smart Shopping Chat Assistant API
  version: 1.0.0-draft
  description: |
    Contract-first API for the Android client (Phase 0 draft, frozen at `frontend-freeze-v1.4`).

    Conventions:
    - JSON properties are snake_case. Money is `{amount_minor, currency}` in minor units (D-011).
    - Every request carries `X-Correlation-Id`; responses echo it.
    - Mutations that create resources require `Idempotency-Key`; replaying a key returns the original result.
    - Rate-limited responses return 429 with `RateLimit-*` and `Retry-After` headers.
    - Errors always use the `ErrorEnvelope` shape and never include sensitive detail.
    - Recovery endpoints return identical bodies whether or not the account exists.
  license:
    name: Proprietary
servers:
  - url: https://api.example.invalid
    description: Placeholder — real hosts are configured per environment in Phase 3.
  - url: http://localhost:4010
    description: Prism mock server (Phase 1)
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: me
  - name: dashboard
  - name: providers
  - name: chat
  - name: comparison
  - name: cart-tasks
  - name: deep-links
  - name: history
  - name: recommendations

paths:
  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and device session started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated token pair. The previous refresh token is now invalid; reuse revokes the token family.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '204': { description: Session ended. }
        '401': { $ref: '#/components/responses/Error' }

  /v1/auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPasswordRequest' }
      responses:
        '202':
          description: Always returned, whether or not the details match (enumeration-resistant).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryAccepted' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '200':
          description: Password changed; all other sessions revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResetPasswordResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/forgot-user-id:
    post:
      tags: [auth]
      operationId: forgotUserId
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotUserIdRequest' }
      responses:
        '202':
          description: Always returned. The user ID is only ever sent to the verified email.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryAccepted' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Device sessions for the current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/auth/sessions/{sessionId}:
    delete:
      tags: [auth]
      operationId: revokeSession
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/auth/sessions/revoke-all:
    post:
      tags: [auth]
      operationId: revokeAllSessions
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: All sessions except the current one revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevokeAllResponse' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/me:
    get:
      tags: [me]
      operationId: getProfile
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/me/consents:
    get:
      tags: [me]
      operationId: listConsents
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Versioned consent records.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentList' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/me/consents/{consentKey}:
    put:
      tags: [me]
      operationId: setConsent
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: consentKey
          in: path
          required: true
          schema: { type: string, examples: [automation.zomato, history.blinkit, ai_processing] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetConsentRequest' }
      responses:
        '200':
          description: Consent recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Consent' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/me/activity:
    get:
      tags: [me]
      operationId: listActivity
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recent automation, consent and data events visible to the user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/me/data/export:
    post:
      tags: [me]
      operationId: requestExport
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StepUp' }
      responses:
        '202':
          description: Export queued; delivered to the verified email.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataRequestAccepted' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/me/data/delete:
    post:
      tags: [me]
      operationId: requestDeletion
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteDataRequest' }
      responses:
        '202':
          description: Deletion queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataRequestAccepted' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/dashboard/summary:
    get:
      tags: [dashboard]
      operationId: getDashboardSummary
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: month
          in: query
          required: false
          schema: { $ref: '#/components/schemas/YearMonth' }
      responses:
        '200':
          description: Home screen data. All figures are computed server-side.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/dashboard/monthly:
    get:
      tags: [dashboard]
      operationId: getMonthly
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: from, in: query, required: true, schema: { $ref: '#/components/schemas/YearMonth' } }
        - { name: to, in: query, required: true, schema: { $ref: '#/components/schemas/YearMonth' } }
        - { name: provider, in: query, required: false, schema: { $ref: '#/components/schemas/ProviderKey' } }
        - { name: category, in: query, required: false, schema: { $ref: '#/components/schemas/Category' } }
      responses:
        '200':
          description: Monthly metrics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyMetrics' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/providers:
    get:
      tags: [providers]
      operationId: listProviders
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Provider registry with capability, flag and consent status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderList' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/chat/sessions:
    get:
      tags: [chat]
      operationId: listChatSessions
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Conversation list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSessionPage' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [chat]
      operationId: createChatSession
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChatSessionRequest' }
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSession' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/chat/sessions/{sessionId}:
    get:
      tags: [chat]
      operationId: getChatSession
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Session with messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatSessionDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [chat]
      operationId: deleteChatSession
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/chat/messages:
    post:
      tags: [chat]
      operationId: sendChatMessage
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatMessageRequest' }
      responses:
        '200':
          description: Assistant turn. Claude output has already been schema-validated and policy-checked server-side.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantTurn' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/comparison/quotes:
    post:
      tags: [comparison]
      operationId: createQuote
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '201':
          description: Comparison snapshot (may be `in_progress`; poll GET).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComparisonQuote' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/comparison/quotes/{quoteId}:
    get:
      tags: [comparison]
      operationId: getQuote
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: quoteId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Comparison snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComparisonQuote' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/comparison/quotes/{quoteId}/confirm:
    post:
      tags: [comparison]
      operationId: confirmQuote
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: quoteId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmQuoteRequest' }
      responses:
        '200':
          description: Provider choice recorded against the snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteConfirmation' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /v1/cart-tasks:
    post:
      tags: [cart-tasks]
      operationId: createCartTask
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCartTaskRequest' }
      responses:
        '201':
          description: Task in `AWAITING_APPROVAL`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartTask' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/cart-tasks/{taskId}:
    get:
      tags: [cart-tasks]
      operationId: getCartTask
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Task with timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartTask' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/cart-tasks/{taskId}/approve:
    post:
      tags: [cart-tasks]
      operationId: approveCartTask
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: taskId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveCartTaskRequest' }
      responses:
        '200':
          description: Task `APPROVED`. Duplicate approvals return the same result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartTask' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /v1/cart-tasks/{taskId}/checkpoint:
    post:
      tags: [cart-tasks]
      operationId: answerCheckpoint
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: taskId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckpointDecision' }
      responses:
        '200':
          description: Checkpoint answered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartTask' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/cart-tasks/{taskId}/stop:
    post:
      tags: [cart-tasks]
      operationId: stopCartTask
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: taskId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StopCartTaskRequest' }
      responses:
        '200':
          description: Task `CANCELLED`. Always idempotent and never rate-limited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartTask' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/deep-links:
    post:
      tags: [deep-links]
      operationId: createHandoff
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoffRequest' }
      responses:
        '201':
          description: Signed, one-time, short-lived handoff.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Handoff' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/history/import:
    post:
      tags: [history]
      operationId: startHistoryImport
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '201':
          description: Import session created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportSession' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/history/import/{sessionId}:
    get:
      tags: [history]
      operationId: getHistoryImport
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Import progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportSession' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/history/orders:
    get:
      tags: [history]
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - { name: provider, in: query, required: false, schema: { $ref: '#/components/schemas/ProviderKey' } }
      responses:
        '200':
          description: Normalized orders.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/history/orders/{orderId}:
    delete:
      tags: [history]
      operationId: deleteOrder
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/recommendations:
    get:
      tags: [recommendations]
      operationId: listRecommendations
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: category, in: query, required: false, schema: { $ref: '#/components/schemas/Category' } }
      responses:
        '200':
          description: Suggestions from deterministic features; wording may come from Claude.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationList' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/recommendations/{recommendationId}/feedback:
    post:
      tags: [recommendations]
      operationId: recommendationFeedback
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: recommendationId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationFeedback' }
      responses:
        '204': { description: Recorded. }
        '401': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Short-lived access token (≤15 minutes).

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 64 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  headers:
    RetryAfter:
      schema: { type: integer }
      description: Seconds to wait.
    RateLimitLimit:
      schema: { type: integer }
    RateLimitRemaining:
      schema: { type: integer }
    RateLimitReset:
      schema: { type: integer }

  responses:
    Error:
      description: Error envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    # ---------- shared ----------
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlation_id]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: User-safe message. }
            correlation_id: { type: string }
            retry_after_seconds: { type: [integer, 'null'] }
            field_errors:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field, code]
                properties:
                  field: { type: string }
                  code: { type: string }
    ErrorCode:
      type: string
      description: See contracts/error-codes.yaml for meaning and client handling.
      enum:
        - validation_failed
        - unauthenticated
        - session_expired
        - forbidden
        - not_found
        - conflict
        - user_id_unavailable
        - weak_password
        - invalid_credentials
        - account_locked
        - challenge_expired
        - rate_limited
        - quote_expired
        - price_changed
        - provider_disabled
        - consent_required
        - task_expired
        - task_state_conflict
        - policy_blocked
        - ai_unavailable
        - service_unavailable
        - internal_error
    Money:
      type: object
      additionalProperties: false
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, description: Minor units (paise for INR). }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    YearMonth:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    Category:
      type: string
      enum: [travel, food, grocery, shopping]
    ProviderKey:
      type: string
      enum: [uber, ola, rapido, zomato, swiggy, blinkit, bigbasket, swiggy_instamart, amazon, flipkart, zepto]
    Confidence:
      type: string
      enum: [high, medium, low]
    DeviceInfo:
      type: object
      additionalProperties: false
      required: [device_id, platform, app_version]
      properties:
        device_id: { type: string }
        platform: { type: string, enum: [android] }
        app_version: { type: string }
        os_version: { type: [string, 'null'] }

    # ---------- auth ----------
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [user_id, email, password, accepted_terms_version, accepted_privacy_version, device]
      properties:
        user_id: { type: string, minLength: 4, maxLength: 30, pattern: '^[a-z0-9._-]+$' }
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 128, writeOnly: true }
        accepted_terms_version: { type: string }
        accepted_privacy_version: { type: string }
        device: { $ref: '#/components/schemas/DeviceInfo' }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [user_id, password, device, remember_device]
      properties:
        user_id: { type: string }
        password: { type: string, writeOnly: true }
        device: { $ref: '#/components/schemas/DeviceInfo' }
        remember_device: { type: boolean }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token, device_id]
      properties:
        refresh_token: { type: string }
        device_id: { type: string }
    TokenPair:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, access_expires_in_seconds]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        access_expires_in_seconds: { type: integer, maximum: 900 }
    AuthSession:
      type: object
      additionalProperties: false
      required: [user_id, session_id, tokens, email_verification_required]
      properties:
        user_id: { type: string }
        session_id: { type: string }
        tokens: { $ref: '#/components/schemas/TokenPair' }
        email_verification_required: { type: boolean }
        session_expires_at: { type: [string, 'null'], format: date-time }
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [user_id, email]
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
    ForgotUserIdRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
    RecoveryAccepted:
      type: object
      additionalProperties: false
      required: [message, challenge_id, expires_in_seconds]
      properties:
        message: { type: string }
        challenge_id: { type: string, description: Issued in every case so responses are indistinguishable. }
        expires_in_seconds: { type: integer }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, code, new_password]
      properties:
        challenge_id: { type: string }
        code: { type: string, minLength: 6, maxLength: 8 }
        new_password: { type: string, minLength: 10, maxLength: 128, writeOnly: true }
    ResetPasswordResponse:
      type: object
      additionalProperties: false
      required: [password_reset, all_other_sessions_revoked]
      properties:
        password_reset: { type: boolean }
        all_other_sessions_revoked: { type: boolean }
    DeviceSession:
      type: object
      additionalProperties: false
      required: [session_id, device_label, platform, app_version, last_seen_at, current]
      properties:
        session_id: { type: string }
        device_label: { type: string }
        platform: { type: string }
        app_version: { type: string }
        approximate_location: { type: [string, 'null'] }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }
    SessionList:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/DeviceSession' }
    RevokeAllResponse:
      type: object
      additionalProperties: false
      required: [revoked_count]
      properties:
        revoked_count: { type: integer }

    # ---------- me ----------
    PrivacyMode:
      type: string
      enum: [device_only, normalized_upload]
    Profile:
      type: object
      additionalProperties: false
      required: [user_id, email_masked, email_verified, privacy_mode, created_at]
      properties:
        user_id: { type: string }
        email_masked: { type: string, examples: ['a***@e***.com'] }
        email_verified: { type: boolean }
        privacy_mode: { $ref: '#/components/schemas/PrivacyMode' }
        created_at: { type: string, format: date-time }
    Consent:
      type: object
      additionalProperties: false
      required: [key, granted, version, updated_at]
      properties:
        key: { type: string }
        granted: { type: boolean }
        version: { type: string }
        updated_at: { type: string, format: date-time }
    ConsentList:
      type: object
      additionalProperties: false
      required: [consents]
      properties:
        consents:
          type: array
          items: { $ref: '#/components/schemas/Consent' }
    SetConsentRequest:
      type: object
      additionalProperties: false
      required: [granted, version]
      properties:
        granted: { type: boolean }
        version: { type: string }
    ActivityEvent:
      type: object
      additionalProperties: false
      required: [event_id, at, type, summary]
      properties:
        event_id: { type: string }
        at: { type: string, format: date-time }
        type:
          type: string
          enum: [automation_approved, automation_stopped, automation_completed, automation_failed, consent_granted, consent_revoked, history_imported, data_exported, data_deleted, session_revoked]
        summary: { type: string }
        provider: { oneOf: [{ $ref: '#/components/schemas/ProviderKey' }, { type: 'null' }] }
        task_id: { type: [string, 'null'] }
    ActivityPage:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/ActivityEvent' }
        next_cursor: { type: [string, 'null'] }
    StepUp:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, writeOnly: true, description: Step-up re-authentication. }
    DeleteDataRequest:
      type: object
      additionalProperties: false
      required: [scope, password]
      properties:
        scope: { type: string, enum: [history, chat, account] }
        password: { type: string, writeOnly: true }
    DataRequestAccepted:
      type: object
      additionalProperties: false
      required: [request_id, status, message]
      properties:
        request_id: { type: string }
        status: { type: string, enum: [queued, in_progress, completed] }
        message: { type: string }
        sla_days: { type: [integer, 'null'] }

    # ---------- dashboard ----------
    KpiSet:
      type: object
      additionalProperties: false
      required: [total_orders, total_amount, average_order_value, orders_per_week]
      properties:
        total_orders: { type: integer, minimum: 0 }
        total_amount: { $ref: '#/components/schemas/Money' }
        average_order_value: { $ref: '#/components/schemas/Money' }
        orders_per_week: { type: number, minimum: 0 }
        days_between_orders: { type: [number, 'null'] }
    KpiDelta:
      type: object
      additionalProperties: false
      required: [total_orders_pct, total_amount_pct, orders_per_week_pct]
      properties:
        total_orders_pct: { type: [number, 'null'] }
        total_amount_pct: { type: [number, 'null'] }
        orders_per_week_pct: { type: [number, 'null'] }
    Split:
      type: object
      additionalProperties: false
      required: [key, label, orders, amount]
      properties:
        key: { type: string }
        label: { type: string }
        orders: { type: integer }
        amount: { $ref: '#/components/schemas/Money' }
    DataFreshness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [fresh, stale, never_imported] }
        last_imported_at: { type: [string, 'null'], format: date-time }
    CategoryCard:
      type: object
      additionalProperties: false
      required: [category, title, providers, status]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        title: { type: string }
        providers:
          type: array
          items: { $ref: '#/components/schemas/ProviderKey' }
        status: { type: string, enum: [ready, setup_required, unavailable] }
    ComparisonSummary:
      type: object
      additionalProperties: false
      required: [quote_id, category, title, created_at, status]
      properties:
        quote_id: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        title: { type: string }
        recommended_provider: { oneOf: [{ $ref: '#/components/schemas/ProviderKey' }, { type: 'null' }] }
        total_estimate: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        created_at: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ComparisonStatus' }
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [month, available_months, currency, kpis, delta_vs_previous, provider_split, category_split, freshness, categories, suggestions_preview, recent_comparisons]
      properties:
        month: { $ref: '#/components/schemas/YearMonth' }
        available_months:
          type: array
          items: { $ref: '#/components/schemas/YearMonth' }
        currency: { type: string }
        kpis: { $ref: '#/components/schemas/KpiSet' }
        previous_kpis: { oneOf: [{ $ref: '#/components/schemas/KpiSet' }, { type: 'null' }] }
        delta_vs_previous: { $ref: '#/components/schemas/KpiDelta' }
        provider_split:
          type: array
          items: { $ref: '#/components/schemas/Split' }
        category_split:
          type: array
          items: { $ref: '#/components/schemas/Split' }
        freshness: { $ref: '#/components/schemas/DataFreshness' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/CategoryCard' }
        suggestions_preview:
          type: array
          items: { $ref: '#/components/schemas/Recommendation' }
        recent_comparisons:
          type: array
          items: { $ref: '#/components/schemas/ComparisonSummary' }
    MonthMetrics:
      type: object
      additionalProperties: false
      required: [month, kpis, provider_split, category_split]
      properties:
        month: { $ref: '#/components/schemas/YearMonth' }
        kpis: { $ref: '#/components/schemas/KpiSet' }
        provider_split:
          type: array
          items: { $ref: '#/components/schemas/Split' }
        category_split:
          type: array
          items: { $ref: '#/components/schemas/Split' }
    MonthlyMetrics:
      type: object
      additionalProperties: false
      required: [currency, months]
      properties:
        currency: { type: string }
        months:
          type: array
          items: { $ref: '#/components/schemas/MonthMetrics' }

    # ---------- providers ----------
    ProviderCapabilities:
      type: object
      additionalProperties: false
      required: [cart_automation, history_import, deep_link, comparison]
      properties:
        cart_automation: { type: string, enum: [supported, ride_setup_only, manual_only, unsupported] }
        history_import: { type: string, enum: [supported, manual_only, unsupported] }
        deep_link: { type: string, enum: [cart, app_launch, none] }
        comparison: { type: string, enum: [supported, partial, unsupported] }
    Provider:
      type: object
      additionalProperties: false
      required: [key, display_name, category, capabilities, status, installed, consent]
      properties:
        key: { $ref: '#/components/schemas/ProviderKey' }
        display_name: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        capabilities: { $ref: '#/components/schemas/ProviderCapabilities' }
        status:
          type: string
          enum: [enabled, disabled, kill_switched, pending_approval]
          description: Server-controlled feature flag / kill switch state.
        installed: { type: [boolean, 'null'], description: Filled by the client from PackageManager; null from server. }
        consent:
          type: object
          additionalProperties: false
          required: [automation, history]
          properties:
            automation: { type: boolean }
            history: { type: boolean }
        adapter_version: { type: [string, 'null'] }
    ProviderList:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/Provider' }

    # ---------- chat ----------
    CreateChatSessionRequest:
      type: object
      additionalProperties: false
      required: [category]
      properties:
        category: { $ref: '#/components/schemas/Category' }
    ChatSession:
      type: object
      additionalProperties: false
      required: [session_id, category, title, created_at]
      properties:
        session_id: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
    ChatSessionPage:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/ChatSession' }
        next_cursor: { type: [string, 'null'] }
    ChatMessage:
      type: object
      additionalProperties: false
      required: [message_id, role, text, created_at]
      properties:
        message_id: { type: string }
        role: { type: string, enum: [user, assistant, system] }
        text: { type: string }
        created_at: { type: string, format: date-time }
        turn: { oneOf: [{ $ref: '#/components/schemas/AssistantTurn' }, { type: 'null' }] }
    ChatSessionDetail:
      type: object
      additionalProperties: false
      required: [session, messages]
      properties:
        session: { $ref: '#/components/schemas/ChatSession' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
    ChatMessageRequest:
      type: object
      additionalProperties: false
      required: [session_id, text, context]
      properties:
        session_id: { type: string }
        text: { type: string, minLength: 1, maxLength: 2000 }
        clarification_answer:
          type: [object, 'null']
          additionalProperties: false
          required: [clarification_id, option_id]
          properties:
            clarification_id: { type: string }
            option_id: { type: string }
        context:
          type: object
          additionalProperties: false
          required: [installed_providers, locale, currency]
          properties:
            installed_providers:
              type: array
              items: { $ref: '#/components/schemas/ProviderKey' }
            locale: { type: string }
            currency: { type: string }
    CartLine:
      type: object
      additionalProperties: false
      required: [line_id, name, quantity]
      properties:
        line_id: { type: string }
        name: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 50 }
        size: { type: [string, 'null'] }
        brand: { type: [string, 'null'] }
        modifiers:
          type: array
          items: { type: string }
    RideRequest:
      type: object
      additionalProperties: false
      required: [pickup_label, drop_label, ride_class]
      properties:
        pickup_label: { type: string, description: User-facing label only; precise coordinates stay on device. }
        drop_label: { type: string }
        ride_class: { type: string, enum: [bike, auto, mini, sedan, suv, any] }
        when: { type: [string, 'null'], format: date-time }
    CartDraft:
      type: object
      additionalProperties: false
      required: [category]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        selected_provider: { oneOf: [{ $ref: '#/components/schemas/ProviderKey' }, { type: 'null' }] }
        lines:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }
        ride: { oneOf: [{ $ref: '#/components/schemas/RideRequest' }, { type: 'null' }] }
    Clarification:
      type: object
      additionalProperties: false
      required: [clarification_id, question, options]
      properties:
        clarification_id: { type: string }
        question: { type: string }
        options:
          type: array
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required: [option_id, label]
            properties:
              option_id: { type: string }
              label: { type: string }
    AssistantTurn:
      type: object
      additionalProperties: false
      required: [message_id, reply_text, intent, next_step]
      properties:
        message_id: { type: string }
        reply_text: { type: string }
        intent:
          type: object
          additionalProperties: false
          required: [type, confidence]
          properties:
            type: { type: string, enum: [order, book_ride, view_summary, suggest_purchase, import_history, general, unknown] }
            category: { oneOf: [{ $ref: '#/components/schemas/Category' }, { type: 'null' }] }
            confidence: { type: number, minimum: 0, maximum: 1 }
        next_step:
          type: string
          enum: [none, clarify, review_cart, compare, open_dashboard, start_import]
          description: Deterministically chosen by the orchestrator, not by the model.
        clarification: { oneOf: [{ $ref: '#/components/schemas/Clarification' }, { type: 'null' }] }
        cart_draft: { oneOf: [{ $ref: '#/components/schemas/CartDraft' }, { type: 'null' }] }
        degraded: { type: boolean, default: false, description: True when Claude was unavailable and a deterministic fallback answered. }

    # ---------- comparison ----------
    Objective:
      type: string
      enum: [lowest_total, fastest, best_value, fewest_providers, preferred_provider]
    ComparisonStatus:
      type: string
      enum: [in_progress, complete, partial_coverage, stale, incomparable, unavailable, price_changed, manual_only]
    QuoteRequest:
      type: object
      additionalProperties: false
      required: [category, objective, eligible_providers]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        cart_lines:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }
        ride: { oneOf: [{ $ref: '#/components/schemas/RideRequest' }, { type: 'null' }] }
        eligible_providers:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ProviderKey' }
        selected_provider: { oneOf: [{ $ref: '#/components/schemas/ProviderKey' }, { type: 'null' }] }
        objective: { $ref: '#/components/schemas/Objective' }
        chat_session_id: { type: [string, 'null'] }
    MatchedLine:
      type: object
      additionalProperties: false
      required: [line_id, requested_name, match]
      properties:
        line_id: { type: string }
        requested_name: { type: string }
        matched_name: { type: [string, 'null'] }
        matched_size: { type: [string, 'null'] }
        quantity: { type: integer }
        unit_price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        line_total: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        match: { type: string, enum: [exact, equivalent, different_pack, different_class, unavailable, uncertain] }
        note: { type: [string, 'null'] }
    CostComponents:
      type: object
      additionalProperties: false
      properties:
        item_subtotal: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        delivery_fee: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        packaging_fee: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        platform_fee: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        small_cart_fee: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        surge_or_booking_fee: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        taxes: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        discounts: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: Expressed as a positive amount subtracted from the total. }
    ProviderResult:
      type: object
      additionalProperties: false
      required: [provider, availability, lines, components, unavailable_fields, notes]
      properties:
        provider: { $ref: '#/components/schemas/ProviderKey' }
        availability: { type: string, enum: [available, partial, unavailable, not_checked, failed] }
        captured_at: { type: [string, 'null'], format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/MatchedLine' }
        components: { $ref: '#/components/schemas/CostComponents' }
        total_estimate: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        eta_minutes: { type: [integer, 'null'] }
        rank: { type: [integer, 'null'] }
        unavailable_fields:
          type: array
          items: { type: string }
        notes:
          type: array
          items: { type: string }
    Recommendation_Label:
      type: string
      enum: [cheapest, lowest_observed_estimate, fastest, best_value, preferred, none]
      description: '`cheapest` is only allowed when coverage.complete is true and no fee fields are missing.'
    ComparisonQuote:
      type: object
      additionalProperties: false
      required: [quote_id, category, status, currency, created_at, expires_at, objective, coverage, provider_results, missing_fields, assumptions, confidence, requires_user_confirmation, recommendation]
      properties:
        quote_id: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        status: { $ref: '#/components/schemas/ComparisonStatus' }
        currency: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        objective: { $ref: '#/components/schemas/Objective' }
        selected_provider: { oneOf: [{ $ref: '#/components/schemas/ProviderKey' }, { type: 'null' }] }
        recommendation:
          type: object
          additionalProperties: false
          required: [label, reason]
          properties:
            provider: { oneOf: [{ $ref: '#/components/schemas/ProviderKey' }, { type: 'null' }] }
            label: { $ref: '#/components/schemas/Recommendation_Label' }
            reason: { type: string }
            savings_vs_selected: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        coverage:
          type: object
          additionalProperties: false
          required: [checked, failed, complete]
          properties:
            checked:
              type: array
              items: { $ref: '#/components/schemas/ProviderKey' }
            failed:
              type: array
              items: { $ref: '#/components/schemas/ProviderKey' }
            complete: { type: boolean }
        provider_results:
          type: array
          items: { $ref: '#/components/schemas/ProviderResult' }
        missing_fields:
          type: array
          items: { type: string }
        assumptions:
          type: array
          items: { type: string }
        confidence: { $ref: '#/components/schemas/Confidence' }
        requires_user_confirmation: { type: boolean }
        previous_total_estimate: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: Set when status is price_changed. }
    ConfirmQuoteRequest:
      type: object
      additionalProperties: false
      required: [provider, acknowledged_switch]
      properties:
        provider: { $ref: '#/components/schemas/ProviderKey' }
        acknowledged_switch: { type: boolean, description: Must be true when provider differs from selected_provider. }
    QuoteConfirmation:
      type: object
      additionalProperties: false
      required: [quote_id, confirmed_provider, confirmed_at]
      properties:
        quote_id: { type: string }
        confirmed_provider: { $ref: '#/components/schemas/ProviderKey' }
        confirmed_at: { type: string, format: date-time }

    # ---------- cart tasks ----------
    TaskStatus:
      type: string
      enum: [DRAFT, AWAITING_APPROVAL, APPROVED, RUNNING, CHECKPOINT, NEEDS_USER_ACTION, CART_READY, HANDED_OFF, CANCELLED, EXPIRED, FAILED_SAFE, BLOCKED_POLICY]
    ActionRisk:
      type: string
      enum: [low, medium, high, prohibited]
    PlannedAction:
      type: object
      additionalProperties: false
      required: [action_id, type, description, risk]
      properties:
        action_id: { type: string }
        type: { type: string, enum: [open_app, search, select_item, set_quantity, choose_variant, choose_slot, set_pickup, set_drop, choose_ride_class, remove_item, change_address, verify_cart] }
        description: { type: string }
        risk: { $ref: '#/components/schemas/ActionRisk' }
    TaskEvent:
      type: object
      additionalProperties: false
      required: [seq, at, type, description]
      properties:
        seq: { type: integer }
        at: { type: string, format: date-time }
        type: { type: string, enum: [state_changed, action_started, action_succeeded, action_failed, checkpoint_raised, checkpoint_answered, halt, cart_verified, handoff_created] }
        description: { type: string }
        action_id: { type: [string, 'null'] }
    CartTask:
      type: object
      additionalProperties: false
      required: [task_id, provider, quote_id, status, created_at, expires_at, limits, planned_actions, events]
      properties:
        task_id: { type: string }
        provider: { $ref: '#/components/schemas/ProviderKey' }
        quote_id: { type: string, description: Comparison snapshot this task is bound to. }
        status: { $ref: '#/components/schemas/TaskStatus' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        limits:
          type: object
          additionalProperties: false
          required: [max_actions, max_runtime_seconds, inactivity_timeout_seconds]
          properties:
            max_actions: { type: integer, minimum: 1, maximum: 60 }
            max_runtime_seconds: { type: integer, minimum: 10, maximum: 600 }
            inactivity_timeout_seconds: { type: integer, minimum: 5, maximum: 120 }
        actions_used: { type: integer, default: 0 }
        planned_actions:
          type: array
          items: { $ref: '#/components/schemas/PlannedAction' }
        events:
          type: array
          items: { $ref: '#/components/schemas/TaskEvent' }
        checkpoint:
          type: [object, 'null']
          additionalProperties: false
          required: [checkpoint_id, prompt, risk]
          properties:
            checkpoint_id: { type: string }
            prompt: { type: string }
            risk: { $ref: '#/components/schemas/ActionRisk' }
        needs_user_action:
          type: [object, 'null']
          additionalProperties: false
          required: [reason, message]
          properties:
            reason: { type: string, enum: [login_required, otp_required, captcha, biometric, password_prompt, unexpected_dialog, location_permission, app_update_required, item_unavailable] }
            message: { type: string }
        cart:
          type: [object, 'null']
          additionalProperties: false
          required: [verified, lines]
          properties:
            verified: { type: boolean }
            verified_at: { type: [string, 'null'], format: date-time }
            lines:
              type: array
              items: { $ref: '#/components/schemas/MatchedLine' }
            total_estimate: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
            differs_from_quote: { type: boolean, default: false }
        failure:
          type: [object, 'null']
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, enum: [unknown_screen, package_mismatch, max_actions_reached, runtime_exceeded, inactivity_timeout, cart_verification_failed, provider_kill_switch, network_lost, app_not_installed, policy_blocked] }
            message: { type: string }
    CreateCartTaskRequest:
      type: object
      additionalProperties: false
      required: [quote_id, provider, task_type]
      properties:
        quote_id: { type: string }
        provider: { $ref: '#/components/schemas/ProviderKey' }
        task_type: { type: string, enum: [add_to_cart, ride_setup] }
    ApproveCartTaskRequest:
      type: object
      additionalProperties: false
      required: [approved_action_ids, approval_nonce]
      properties:
        approved_action_ids:
          type: array
          minItems: 1
          items: { type: string }
        approval_nonce: { type: string }
    CheckpointDecision:
      type: object
      additionalProperties: false
      required: [checkpoint_id, decision]
      properties:
        checkpoint_id: { type: string }
        decision: { type: string, enum: [approve, reject] }
    StopCartTaskRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, enum: [emergency_stop, user_cancel, pause_all] }

    # ---------- deep links ----------
    HandoffRequest:
      type: object
      additionalProperties: false
      required: [task_id]
      properties:
        task_id: { type: string }
    Handoff:
      type: object
      additionalProperties: false
      required: [handoff_url, strategy, expires_at, manual_steps]
      properties:
        handoff_url: { type: string, description: Opaque one-time token URL; contains no IDs or order data. }
        strategy: { type: string, enum: [cart_deep_link, app_launch, manual] }
        target_package: { type: [string, 'null'] }
        expires_at: { type: string, format: date-time }
        manual_steps:
          type: array
          items: { type: string }

    # ---------- history ----------
    ImportRequest:
      type: object
      additionalProperties: false
      required: [providers, fields, upload_mode]
      properties:
        providers:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ProviderKey' }
        fields:
          type: array
          items: { type: string, enum: [order_date, items, quantity, amounts, status, location_label] }
        upload_mode: { $ref: '#/components/schemas/PrivacyMode' }
    ImportSession:
      type: object
      additionalProperties: false
      required: [session_id, status, providers, upload_mode]
      properties:
        session_id: { type: string }
        status: { type: string, enum: [awaiting_permission, running, paused, awaiting_review, completed, cancelled, failed] }
        upload_mode: { $ref: '#/components/schemas/PrivacyMode' }
        providers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [provider, status, orders_found]
            properties:
              provider: { $ref: '#/components/schemas/ProviderKey' }
              status: { type: string, enum: [pending, running, completed, failed, skipped] }
              orders_found: { type: integer }
              confidence: { oneOf: [{ $ref: '#/components/schemas/Confidence' }, { type: 'null' }] }
              message: { type: [string, 'null'] }
        review_sample:
          type: array
          items: { $ref: '#/components/schemas/Order' }
    OrderStatus:
      type: string
      enum: [PLACED, CONFIRMED, PREPARING, OUT_FOR_DELIVERY, DELIVERED, CANCELLED, REFUNDED, PARTIALLY_REFUNDED, UNKNOWN]
    Order:
      type: object
      additionalProperties: false
      required: [order_id, provider, category, ordered_at, status, total, items, extraction_confidence]
      properties:
        order_id: { type: string, description: Server-side ID; the provider order ID is stored only as a hash. }
        provider: { $ref: '#/components/schemas/ProviderKey' }
        category: { $ref: '#/components/schemas/Category' }
        ordered_at: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/OrderStatus' }
        total: { $ref: '#/components/schemas/Money' }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, quantity]
            properties:
              name: { type: string }
              quantity: { type: integer }
              amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        location_label: { type: [string, 'null'] }
        extraction_confidence: { $ref: '#/components/schemas/Confidence' }
    OrderPage:
      type: object
      additionalProperties: false
      required: [orders]
      properties:
        orders:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        next_cursor: { type: [string, 'null'] }

    # ---------- recommendations ----------
    Recommendation:
      type: object
      additionalProperties: false
      required: [recommendation_id, label, category, confidence, reason_codes, explanation]
      properties:
        recommendation_id: { type: string }
        label: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        confidence: { $ref: '#/components/schemas/Confidence' }
        reason_codes:
          type: array
          items: { type: string, enum: [recent, frequent, regular_interval, due_soon, weekday_pattern, seasonal] }
        explanation: { type: string }
        usual_provider: { oneOf: [{ $ref: '#/components/schemas/ProviderKey' }, { type: 'null' }] }
        prefill_lines:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }
    RecommendationList:
      type: object
      additionalProperties: false
      required: [recommendations, disclaimer]
      properties:
        recommendations:
          type: array
          items: { $ref: '#/components/schemas/Recommendation' }
        disclaimer: { type: string }
    RecommendationFeedback:
      type: object
      additionalProperties: false
      required: [useful]
      properties:
        useful: { type: boolean }
