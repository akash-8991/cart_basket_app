# Error-code catalogue. The `code` field of ErrorEnvelope is one of these keys.
# client_action tells the Android app how to render it. Messages shown to users come from
# app string resources keyed by code, not from the server message, so copy stays frozen.
version: 1
codes:
  validation_failed:    { http: 400, retryable: false, client_action: show_field_errors }
  unauthenticated:      { http: 401, retryable: false, client_action: go_to_login }
  session_expired:      { http: 401, retryable: false, client_action: refresh_then_login }
  forbidden:            { http: 403, retryable: false, client_action: show_message }
  not_found:            { http: 404, retryable: false, client_action: show_message }
  conflict:             { http: 409, retryable: false, client_action: reload }
  user_id_unavailable:  { http: 409, retryable: false, client_action: show_field_errors }
  weak_password:        { http: 400, retryable: false, client_action: show_field_errors }
  invalid_credentials:  { http: 401, retryable: true,  client_action: show_message, note: "Same message for unknown user and wrong password." }
  account_locked:       { http: 429, retryable: true,  client_action: show_wait, note: "Progressive backoff; retry_after_seconds set." }
  challenge_expired:    { http: 410, retryable: false, client_action: restart_recovery }
  rate_limited:         { http: 429, retryable: true,  client_action: show_wait }
  quote_expired:        { http: 410, retryable: true,  client_action: requote }
  price_changed:        { http: 409, retryable: true,  client_action: show_price_change }
  provider_disabled:    { http: 403, retryable: false, client_action: offer_manual_fallback, note: "Feature flag off or kill switch active." }
  consent_required:     { http: 403, retryable: false, client_action: open_consent }
  task_expired:         { http: 410, retryable: false, client_action: show_message }
  task_state_conflict:  { http: 409, retryable: false, client_action: reload }
  policy_blocked:       { http: 403, retryable: false, client_action: show_message }
  ai_unavailable:       { http: 503, retryable: true,  client_action: deterministic_fallback }
  service_unavailable:  { http: 503, retryable: true,  client_action: show_retry }
  internal_error:       { http: 500, retryable: true,  client_action: show_retry }
